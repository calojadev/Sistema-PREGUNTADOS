services:
  db:
    image: mysql:8
    container_name: intellecto
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: admi321
      MYSQL_DATABASE: Intellecto
    ports:
      - "3308:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-padmi321"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db_data:
